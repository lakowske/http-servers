[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers for organization
markers =
    verification: READ-ONLY tests that verify system state (safe for live system)
    integration: Tests that create temporary resources and clean up
    config: Configuration file testing
    unit: Fast unit tests with no external dependencies
    slow: Slow running tests
    container: Tests that require containers to be running

# Default test selection
addopts =
    --strict-markers
    --disable-warnings
    -v

# Timeout for hanging tests
timeout = 300

# Test output
console_output_style = progress
