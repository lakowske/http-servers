[supervisord]
nodaemon=true
user=root
#logfile=/var/log/supervisor/supervisord.log
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[unix_http_server]
file=/var/run/supervisor.sock

[program:rsyslog]
command=/usr/sbin/rsyslogd -n
stdout_logfile=/var/log/supervisor/rsyslog.log
stderr_logfile=/var/log/supervisor/rsyslog_error.log
autorestart=true
priority=1
startsecs=5

[program:postfix]
command=/usr/sbin/postfix start-fg
#stdout_logfile=/var/log/supervisor/postfix.log
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
#stderr_logfile=/var/log/supervisor/postfix_error.log
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=2
startsecs=10

[program:dovecot]
command=/usr/sbin/dovecot -F
#stdout_logfile=/var/log/supervisor/dovecot.log
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
#stderr_logfile=/var/log/supervisor/dovecot_error.log
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=3
startsecs=10


[supervisorctl]
serverurl=unix:///var/run/supervisor.sock