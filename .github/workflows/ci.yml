name: CI

on:
  push:
    branches: [main, nova]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage pytest-cov black isort

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat all other issues as warnings
          python -m flake8 . --count --max-line-length=120 --statistics

      - name: Check code formatting with black
        run: |
          python -m black --check --line-length=120 .

      - name: Check import sorting with isort
        run: |
          python -m isort --check-only --profile=black --line-length=120 .

      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/unit/ --cov=. --cov-report=xml --cov-report=term-missing

      - name: Run configuration tests
        run: |
          python -m pytest tests/config/ --cov=. --cov-append --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pre-commit coverage pytest-cov

      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files
